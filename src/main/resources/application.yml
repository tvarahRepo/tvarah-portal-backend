server:
  port: 8201
  servlet:
    context-path: /api/v1
  forward-headers-strategy: framework

spring:
  application:
    name: tvarah

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tvarah}
    username: ${DB_USER:tvarah}
    password: ${DB_PASSWORD:4pVhZ873Rm6C}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://portal.tvarah.com/auth/realms/tvarah}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:https://portal.tvarah.com/auth/realms/tvarah/protocol/openid-connect/certs}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://portal.tvarah.com/auth}
  realm: ${KEYCLOAK_REALM:tvarah}
  client-id: ${KEYCLOAK_CLIENT_ID:tvarahbackend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:xCulSbIQd2kNaVp2yqlHnDQTQVQPTOzD}
  token-uri: ${KEYCLOAK_TOKEN_URI:https://portal.tvarah.com/auth/realms/tvarah/protocol/openid-connect/token}
  resource-claim: resource_access

app:
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:https://tvarah-portal.azurewebsites.net/login}
  mail:
    from: ${MAIL_FROM:noreply@tvarah.com}

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui
    oauth2-redirect-url: /swagger-ui/oauth2-redirect.html
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:tvarahbackend}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:xCulSbIQd2kNaVp2yqlHnDQTQVQPTOzD}
      use-basic-authentication-with-access-code-grant: false
    default-models-expand-depth: -1
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.tvarah: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
