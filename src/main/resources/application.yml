server:
  port: 7001
  servlet:
    context-path: /tvarah/api

spring:
  application:
    name: tvarah

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tvarah}
    username: ${DB_USER:tvarah_user}
    password: ${DB_PASSWORD:tvarah_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://10.0.0.6:8080/realms/tvarah}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://10.0.0.6:8080/realms/tvarah/protocol/openid-connect/certs}

keycloak:
  realm: ${KEYCLOAK_REALM:tvarah}
  client-id: ${KEYCLOAK_CLIENT_ID:DatabaseServiceClient}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:RXtBtPtJ4bRC20LmbLXBsr72jMitsJHS}
  token-uri: ${KEYCLOAK_TOKEN_URI:http://10.0.0.6:8080/realms/tvarah/protocol/openid-connect/token}
  resource-claim: resource_access

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: /swagger-ui/oauth2-redirect.html
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:DatabaseServiceClient}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:RXtBtPtJ4bRC20LmbLXBsr72jMitsJHS}
      use-basic-authentication-with-access-code-grant: false
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.tvarah: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
